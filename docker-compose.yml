version: '3.9'

services:
  streakr:
    build: .
    container_name: streakr
    ports:
      - "3001:3001"
    volumes:
      - streakr_data:/app/data
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/streakr.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  streakr_data:
    driver: local
